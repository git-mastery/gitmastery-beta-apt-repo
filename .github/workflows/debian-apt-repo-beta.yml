name: Build & Publish Beta Debian Package

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build-and-publish:
    permissions:
      pages: write
      contents: write
    environment: Main
    runs-on: ubuntu-latest
    env:
      DISTRIBUTION: any
      COMPONENT: main
      RELEASE: 1
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      KEY_ID: ${{ vars.KEY_ID }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout beta APT repository
        uses: actions/checkout@v3
        with:
          repository: git-mastery/gitmastery-beta-apt-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          path: aptrepo

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro dpkg-dev curl jq gnupg debsigs

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$KEY_ID:6:" | gpg --batch --import-ownertrust --pinentry-mode=loopback

      - name: Setup repository structure
        working-directory: aptrepo
        run: |
          mkdir -p repo/conf
          echo "Origin: GitHub" > repo/conf/distributions
          echo "Label: GitHub Git-Mastery Beta" >> repo/conf/distributions
          echo "Suite: stable" >> repo/conf/distributions
          echo "Codename: ${DISTRIBUTION}" >> repo/conf/distributions
          echo "Components: ${COMPONENT}" >> repo/conf/distributions
          echo "Architectures: arm64 amd64" >> repo/conf/distributions
          echo "SignWith: $KEY_ID" >> repo/conf/distributions

          cp pubkey.gpg repo/pubkey.gpg
          cp index.html repo/

      - name: Add .deb
        working-directory: aptrepo
        run: |
          for ARCHITECTURE in "arm64" "amd64"; do
            echo "Publishing beta for $ARCHITECTURE"

            # Beta .deb files are uploaded to the app repo's beta release
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/git-mastery/app/releases/tags/${VERSION} | jq -r --arg suffix "${ARCHITECTURE}.deb" '.assets[] | select(.name | endswith($suffix)) | .browser_download_url')
            TRIMMED_VERSION=${VERSION#v}

            # Package is named gitmastery-beta to allow parallel install alongside stable
            FILENAME="gitmastery-beta_${TRIMMED_VERSION}-1_${ARCHITECTURE}.deb"

            curl -L "$DOWNLOAD_URL" -o $FILENAME

            debsigs -v --gpgopts="--batch --no-tty --pinentry-mode=loopback" --sign=origin --default-key="$KEY_ID" $FILENAME

            reprepro -Vb repo includedeb ${DISTRIBUTION} "gitmastery-beta_${TRIMMED_VERSION}-${RELEASE}_${ARCHITECTURE}.deb"

            tree
          done

      - name: Deploy beta APT repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ORG_PAT }}
          publish_dir: ./aptrepo/repo
          external_repository: git-mastery/gitmastery-beta-apt-repo